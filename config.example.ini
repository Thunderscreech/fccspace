; FCC Space Watch settings. Copy to config.ini and replace every REPLACE_WITH_... value.
; config.ini is git-ignored and read by common.inc (bot_cfg()) and the shell scripts.
; Permissions: chown root:www-data config.ini && chmod 640 config.ini
; Keep values in double quotes; they may not contain a double quote.

; MySQL/MariaDB login used by common.inc
[database]
host = "localhost"
user = "REPLACE_WITH_DATABASE_USER"
password = "REPLACE_WITH_DATABASE_PASSWORD"
name = "fccapplications"

; X/Twitter keys noted in a comment in common.inc (unused)
[twitter_unused]
api_key = "REPLACE_WITH_TWITTER_UNUSED_API_KEY"
api_secret = "REPLACE_WITH_TWITTER_UNUSED_API_SECRET"
bearer_token = "REPLACE_WITH_TWITTER_UNUSED_BEARER_TOKEN"
access_token = "REPLACE_WITH_TWITTER_UNUSED_ACCESS_TOKEN"
access_token_secret = "REPLACE_WITH_TWITTER_UNUSED_ACCESS_TOKEN_SECRET"

; X/Twitter keys used by newer_tweet() (retired)
[twitter_newer]
consumer_key = "REPLACE_WITH_TWITTER_NEWER_CONSUMER_KEY"
consumer_secret = "REPLACE_WITH_TWITTER_NEWER_CONSUMER_SECRET"
access_token = "REPLACE_WITH_TWITTER_NEWER_ACCESS_TOKEN"
access_token_secret = "REPLACE_WITH_TWITTER_NEWER_ACCESS_TOKEN_SECRET"

; X/Twitter keys for the @CBDevTest test account (retired)
[twitter_cbdevtest]
consumer_key = "REPLACE_WITH_TWITTER_CBDEVTEST_CONSUMER_KEY"
consumer_secret = "REPLACE_WITH_TWITTER_CBDEVTEST_CONSUMER_SECRET"
access_token = "REPLACE_WITH_TWITTER_CBDEVTEST_ACCESS_TOKEN"
access_token_secret = "REPLACE_WITH_TWITTER_CBDEVTEST_ACCESS_TOKEN_SECRET"

; X/Twitter API keys (X posting is retired; kept for the old tweet functions)
[twitter]
consumer_key = "REPLACE_WITH_TWITTER_CONSUMER_KEY"
consumer_secret = "REPLACE_WITH_TWITTER_CONSUMER_SECRET"
access_token = "REPLACE_WITH_TWITTER_ACCESS_TOKEN"
access_token_secret = "REPLACE_WITH_TWITTER_ACCESS_TOKEN_SECRET"

; Pushbullet access token (legacy notifications)
[pushbullet]
token = "REPLACE_WITH_PUSHBULLET_TOKEN"

; Google Maps Static API key, used to render map images
[google]
maps_api_key = "REPLACE_WITH_GOOGLE_MAPS_API_KEY"

; Mastodon access token for toot.sh
[mastodon]
access_token = "REPLACE_WITH_MASTODON_ACCESS_TOKEN"
